<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Design a trial, record observations in a paddock with no signal, and get analysis-ready data out." />
    <!-- Light and dark, so the phone's status bar matches the app rather than
         sitting in brown above a dark page. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f2e9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1710" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- iOS ignores the manifest's icons for the home screen and uses this. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Typefaces are self-hosted and bundled; see the note at the top of
         src/index.css for why an offline-first app cannot fetch them. -->
    <title>Fieldwork</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
